name: Verify manuscript certificates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'true'
          build: 'false'
      - name: Build and audit all Lean certificates
        run: |
          printf 'Default main-thread stack (KiB): '
          ulimit -s
          python3 checks/verify_lean.py --serial
      - name: Independent finite checks
        run: |
          python3 checks/cubic47.py
          python3 checks/cubic_slope.py
          python3 checks/cubic_pairs.py
          python3 checks/cubic_cohomology.py
          python3 checks/sextic32.py
          python3 checks/norm_quadratic.py
          python3 checks/phase_dichotomy.py
